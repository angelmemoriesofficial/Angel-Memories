name: Build Angel Memories Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'logo.png'
      - 'hero.png'
      - 'hero2.png'
      - 'apk icon.png'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out official source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK manager and accept licenses
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "Android SDK command-line tools directory not found: $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager executable not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | head -n 30
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | bash "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          bash "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app and create Android project
        shell: bash
        run: |
          npm run build:web
          npx cap add android
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-android-icons.py
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          config = json.loads(Path("capacitor.config.json").read_text())
          app_id = config["appId"]
          package_path = Path(*app_id.split("."))
          package_dir = Path("android/app/src/main/java") / package_path
          package_dir.mkdir(parents=True, exist_ok=True)

          # Keep upgrades compatible with the previously released Android package.
          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text()
          gradle_text, code_count = re.subn(r"(?m)^(\s*versionCode\s+)\d+", r"\g<1>15", gradle_text)
          gradle_text, name_count = re.subn(r'''(?m)^(\s*versionName\s+)["'][^"']+["']''', r'\g<1>"1.0.14"', gradle_text)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text(gradle_text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest)
          root = tree.getroot()
          activity = next(
              (node for node in root.findall(".//activity")
               if node.get(android + "name", "").endswith("MainActivity")),
              None
          )
          if activity is None:
              raise SystemExit("MainActivity not found in generated Android manifest")
          for item in activity.findall("intent-filter"):
              data = item.find("data")
              if data is not None and data.get(android + "scheme") == "com.angelmemories.app":
                  break
          else:
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {
                  android + "scheme": "com.angelmemories.app",
                  android + "host": "login-callback"
              })
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          # Add a native Android DownloadManager bridge so APK downloads are saved
          # directly to the public Downloads folder instead of relying on WebView downloads.
          (package_dir / "ApkDownloaderPlugin.java").write_text("""package __APP_ID__;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ApkDownloader")
          public class ApkDownloaderPlugin extends Plugin {
              @PluginMethod
              public void download(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) {
                      call.reject("A valid HTTPS download URL is required.");
                      return;
                  }

                  DownloadManager manager = (DownloadManager) getContext()
                      .getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager == null) {
                      call.reject("Android Download Manager is unavailable.");
                      return;
                  }

                  try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("Angel Memories APK");
                      request.setDescription("Downloading the official Angel Memories app");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );
                      request.setDestinationInExternalPublicDir(
                          Environment.DIRECTORY_DOWNLOADS,
                          "Angel-Memories.apk"
                      );
                      long downloadId = manager.enqueue(request);

                      JSObject result = new JSObject();
                      result.put("downloadId", downloadId);
                      result.put("fileName", "Angel-Memories.apk");
                      result.put("folder", "Downloads");
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Could not start APK download: " + error.getMessage());
                  }
              }
          }
          """.replace("__APP_ID__", app_id))
          (package_dir / "MainActivity.java").write_text("""package __APP_ID__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkDownloaderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """.replace("__APP_ID__", app_id))
          print("Installed Google OAuth callback and native APK DownloadManager plugin.")
          PY
          npx cap sync android

      # If the original release key is later supplied through GitHub Actions
      # Secrets, produce a properly signed release APK. Never store key material
      # in the repository. Without all four secrets, retain the debug build path.
      - name: Configure release signing when key is available
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          provided=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then provided=$((provided + 1)); fi
          done
          if [ "$provided" -eq 0 ]; then
            echo "APK_BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "No release signing secrets configured; using a debug-signed APK."
            exit 0
          fi
          if [ "$provided" -ne 4 ]; then
            echo "Release signing secrets are incomplete. Configure all four before building."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/android/release-key.jks"
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/release-key.jks"
          python - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          if "signingConfigs {" in source:
              raise SystemExit("Unexpected existing signingConfigs block; refusing to overwrite it.")
          source, count = re.subn(r"(?m)^(\s*)buildTypes\s*\{", lambda m: m.group(1) + "buildTypes {", source, count=1)
          if count != 1:
              raise SystemExit("Could not locate Android buildTypes block.")
          source = re.sub(r"(?m)^(\s*)buildTypes\s*\{", signing + r"\1buildTypes {", source, count=1)
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          source, count = re.subn(pattern, r"\1\n            signingConfig signingConfigs.release", source, count=1)
          if count != 1:
              raise SystemExit("Could not configure the release build type.")
          gradle.write_text(source)
          PY
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "APK_BUILD_VARIANT=release" >> "$GITHUB_ENV"

      - name: Build signed release APK or debug fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$APK_BUILD_VARIANT" = "release" ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk dist/Angel-Memories.apk
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/Angel-Memories.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angel-memories-android-apk
          path: dist/Angel-Memories.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a first-party website download
        shell: bash
        run: |
          mkdir -p download
          cp dist/Angel-Memories.apk download/Angel-Memories.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Angel-Memories.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest APK for direct website download"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Prepare official APK release filename
        run: cp dist/Angel-Memories.apk Angel-Memories.apk

      - name: Publish official APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Angel Memories Latest APK
          files: Angel-Memories.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
