name: Build Angel Memories Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'logo.png'
      - 'hero.png'
      - 'hero2.png'
      - 'apk icon.png'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out official source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK manager and accept licenses
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "Android SDK command-line tools directory not found: $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager executable not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | head -n 30
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | bash "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          bash "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app and create Android project
        run: |
          npm run build:web
          npx cap add android
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-android-icons.py
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angel-memories-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a first-party website download
        shell: bash
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/app-debug.apk download/Angel-Memories.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Angel-Memories.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest APK for direct website download"
            git pull --rebase origin main
            git push
          fi

      - name: Prepare official APK release filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Angel-Memories.apk

      - name: Publish official APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Angel Memories Latest APK
          files: Angel-Memories.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
